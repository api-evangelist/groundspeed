name: Groundspeed
description: >-
  Groundspeed is an insurance data and analytics company that pioneered
  AI-powered extraction and standardization of unstructured commercial
  property and casualty (P&C) insurance documents — loss runs, schedules of
  values, ACORD forms, and broker submissions — turning them into structured,
  analytics-ready data for underwriters, brokers, and carriers. Founded in Ann
  Arbor, Michigan and backed by Insight Partners, Groundspeed was acquired by
  Insurance Quantified, where its technology now powers the Intake,
  Workflow, and Intelligence products of an AI-driven underwriting platform
  serving commercial P&C carriers and MGAs. Groundspeed does not currently
  publish a public developer program, API reference, or self-service
  onboarding surface; this profile tracks its identity and public web
  properties in the API Evangelist network.
